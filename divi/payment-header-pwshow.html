<!-- PW Show page (/paypwshow): Wood Bio/PELICE Show. The PELICE 2028 logo is embedded in this file; once it is in the Media Library, replace the long src="data:..." value with its address. -->
<div id="hbh">
<style>
#hbh{--hbh-accent:#007038;--hbh-photo:url(https://www.hattonbrown.net/wp-content/uploads/2019/08/TPEE18_SB02_2366-e1565899662925.jpg);max-width:1100px;margin:0 auto 28px;font-family:'Rubik','Open Sans',Arial,sans-serif}
#hbh *{box-sizing:border-box}
#hbh .hbh-banner{position:relative;overflow:hidden;border-radius:14px;padding:36px 40px;display:grid;grid-template-columns:auto 1fr;gap:20px 40px;align-items:center;color:#fff;background:linear-gradient(105deg,rgba(14,14,16,.95) 0%,rgba(14,14,16,.88) 52%,rgba(0,0,0,.82) 100%),var(--hbh-photo) center/cover no-repeat,#1c1c1e;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#hbh .hbh-banner:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--hbh-accent)}
#hbh .hbh-logo{background:#fff;border-radius:12px;padding:16px 24px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
#hbh .hbh-logo img{display:block;width:100%;max-width:300px;height:auto;margin:0;padding:0;border:0}
#hbh .hbh-eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#ffc9c5}
#hbh .hbh-eyebrow svg{width:16px;height:16px;flex:none;fill:currentColor}
#hbh h1.hbh-title{margin:0!important;padding:0!important;color:#fff!important;font-family:inherit!important;font-weight:700!important;font-size:clamp(24px,4vw,46px)!important;line-height:1.08!important;letter-spacing:-.01em;text-wrap:balance}
#hbh h1.hbh-title span{display:block;font-weight:400!important;color:#ffd9d6!important;font-size:.72em}
#hbh .hbh-chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
#hbh .hbh-chips li{margin:0;padding:5px 12px;border:1px solid rgba(255,255,255,.4);border-radius:999px;font-size:13px;line-height:1.2;color:#fff;background:rgba(255,255,255,.08)}
#hbh .hbh-note{margin:12px 0 0!important;padding:0!important;font-size:14px;line-height:1.4;color:rgba(255,255,255,.88)}
#hbh .hbh-banner.hbh-nologo{grid-template-columns:1fr}
#hbh .hbh-logo.hbh-three{flex-direction:column;align-items:flex-start;gap:12px;padding:16px 24px}
#hbh .hbh-logo.hbh-three img{width:auto;max-width:none}
#hbh .hbh-logo.hbh-three .hbh-pw{height:44px}
#hbh .hbh-logo.hbh-three .hbh-row{display:flex;align-items:center;gap:18px;width:100%;padding-top:12px;border-top:1px solid #dcdcdc}
#hbh .hbh-logo.hbh-three .hbh-row img{height:66px}
@media (max-width:760px){#hbh .hbh-banner{grid-template-columns:1fr;padding:26px 22px 26px 26px;gap:18px;text-align:left}#hbh .hbh-logo{justify-self:start;padding:12px 18px}#hbh .hbh-logo img{max-width:220px}#hbh .hbh-logo.hbh-three{justify-self:stretch;padding:12px 16px}#hbh .hbh-logo.hbh-three .hbh-pw{height:auto;max-width:72%}#hbh .hbh-logo.hbh-three .hbh-row{gap:12px}#hbh .hbh-logo.hbh-three .hbh-row img:first-child{height:62px;flex:none}#hbh .hbh-logo.hbh-three .hbh-row img:last-child{height:auto;min-width:0;max-width:calc(100% - 82px)}}
</style>
