<!-- Hatton-Brown payment page header banner. Paste into a Divi CODE module at the top of the page, replacing the old hero + logo. -->
<!-- To reuse for another account: change the title text, the logo address (src), and --hbh-accent below. -->
<div id="hbh">
<style>
#hbh{--hbh-accent:#d4271f;--hbh-photo:url(https://www.hattonbrown.net/wp-content/uploads/2019/08/TPEE18_SB02_2366-e1565899662925.jpg);max-width:1100px;margin:0 auto 28px;font-family:'Rubik','Open Sans',Arial,sans-serif}
#hbh *{box-sizing:border-box}
#hbh .hbh-banner{position:relative;overflow:hidden;border-radius:14px;padding:36px 40px;display:grid;grid-template-columns:auto 1fr;gap:20px 40px;align-items:center;color:#fff;background:linear-gradient(105deg,rgba(18,18,20,.95) 0%,rgba(24,24,26,.86) 52%,rgba(120,18,16,.72) 100%),var(--hbh-photo) center/cover no-repeat,#1c1c1e;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#hbh .hbh-banner:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--hbh-accent)}
#hbh .hbh-logo{background:#fff;border-radius:12px;padding:16px 24px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
#hbh .hbh-logo img{display:block;width:100%;max-width:300px;height:auto;margin:0;padding:0;border:0}
#hbh .hbh-eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#ffc9c5}
#hbh .hbh-eyebrow svg{width:16px;height:16px;flex:none;fill:currentColor}
#hbh h1.hbh-title{margin:0!important;padding:0!important;color:#fff!important;font-family:inherit!important;font-weight:700!important;font-size:clamp(24px,4vw,46px)!important;line-height:1.08!important;letter-spacing:-.01em;text-wrap:balance}
#hbh h1.hbh-title span{display:block;font-weight:400!important;color:#ffd9d6!important;font-size:.72em}
#hbh .hbh-chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
#hbh .hbh-chips li{margin:0;padding:5px 12px;border:1px solid rgba(255,255,255,.4);border-radius:999px;font-size:13px;line-height:1.2;color:#fff;background:rgba(255,255,255,.08)}
#hbh .hbh-note{margin:12px 0 0!important;padding:0!important;font-size:14px;line-height:1.4;color:rgba(255,255,255,.88)}
@media (max-width:760px){#hbh .hbh-banner{grid-template-columns:1fr;padding:26px 22px 26px 26px;gap:18px;text-align:left}#hbh .hbh-logo{justify-self:start;padding:12px 18px}#hbh .hbh-logo img{max-width:220px}}
</style>
<div class="hbh-banner">
<div class="hbh-logo"><img src="https://www.hattonbrown.net/wp-content/uploads/2019/08/NewPWLogo-RED-1024x274.png" width="1024" height="274" alt="Panel World"></div>
<div class="hbh-text">
<p class="hbh-eyebrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 1 1 6 0v3H9z"/></svg>Secure online payment</p>
<h1 class="hbh-title">Plywood &amp; Panel World<span>Online Payment</span></h1>
<ul class="hbh-chips" aria-label="Accepted cards"><li>Visa</li><li>Mastercard</li><li>Discover</li><li>American Express</li></ul>
<p class="hbh-note">Debit cards pay no convenience fee. A 3% convenience fee applies to credit cards.</p>
</div>
</div>
</div>
